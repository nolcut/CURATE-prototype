[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faasr-agents"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0,<1.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.7.0",
    "boto3>=1.34.0",
    "pygithub>=2.8.1",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "FaaSr_py>=0.1.13",
    "rich>=13.0.0",
    "readchar>=4.0.0",
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
faasr-agents = "faasr_agents.cli:main"

# FaaSr_py 0.1.13 hard-pins boto3==1.37.11, which predates AWS Bedrock API-key
# (bearer-token / AWS_BEARER_TOKEN_BEDROCK) support. We override that pin to a
# version that supports it so Bedrock API keys authenticate. boto3/botocore are
# backward-compatible for the S3 operations FaaSr_py uses.
[tool.uv]
override-dependencies = ["boto3>=1.39.0", "botocore>=1.39.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/faasr_agents"]
